name: Verify SeedLend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node and worker checks
        run: pnpm check

      - name: Build judge-facing app
        run: pnpm --filter @seedlend/app build

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Creditcoin Solidity tests
        working-directory: contracts/creditcoin
        run: forge test

      - name: Sepolia Solidity tests
        working-directory: contracts/sepolia
        run: forge test
